<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2f6" />
      <stop offset="100%" stop-color="#dfe6ed" />
    </linearGradient>
    <linearGradient id="denimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6d8c" />
      <stop offset="100%" stop-color="#324b61" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgJacket)" rx="12" />
  <!-- Denim Jacket Shape -->
  <g transform="translate(40, 40)">
    <!-- Collar -->
    <polygon points="120,40 160,75 140,95 105,70" fill="#2d4255" />
    <polygon points="200,40 160,75 180,95 215,70" fill="#2d4255" />
    <!-- Back Neck -->
    <path d="M120,40 Q160,55 200,40" stroke="#253746" stroke-width="4" fill="none" />
    <!-- Shoulders & Body -->
    <path d="M70,95 L120,40 L200,40 L250,95 L225,270 L95,270 Z" fill="url(#denimGrad)" />
    <!-- Sleeves -->
    <path d="M70,95 L30,220 L70,230 L95,140" fill="#3b566f" />
    <path d="M250,95 L290,220 L250,230 L225,140" fill="#3b566f" />
    <!-- Front Placket -->
    <line x1="160" y1="75" x2="160" y2="270" stroke="#253746" stroke-width="5" />
    <!-- Pockets -->
    <rect x="115" y="115" width="35" height="35" rx="3" fill="#38526a" stroke="#cca43b" stroke-width="2" stroke-dasharray="3,2" />
    <rect x="170" y="115" width="35" height="35" rx="3" fill="#38526a" stroke="#cca43b" stroke-width="2" stroke-dasharray="3,2" />
    <!-- Flaps -->
    <polygon points="113,115 152,115 132,125" fill="#2d4255" />
    <polygon points="168,115 207,115 187,125" fill="#2d4255" />
    <!-- Buttons -->
    <circle cx="160" cy="110" r="4" fill="#cca43b" />
    <circle cx="160" cy="150" r="4" fill="#cca43b" />
    <circle cx="160" cy="190" r="4" fill="#cca43b" />
    <circle cx="160" cy="230" r="4" fill="#cca43b" />
    <!-- Waistband -->
    <rect x="95" y="260" width="130" height="15" fill="#2d4255" />
    <!-- Vintage Stitching -->
    <line x1="100" y1="262" x2="220" y2="262" stroke="#cca43b" stroke-width="1.5" stroke-dasharray="4,2" />
  </g>
  <text x="200" y="365" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#5a6e7f" text-anchor="middle" letter-spacing="1.5">THRIFTEDGH • 90s DENIM</text>
</svg>