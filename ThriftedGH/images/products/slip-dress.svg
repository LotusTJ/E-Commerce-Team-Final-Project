<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf2f4" />
      <stop offset="100%" stop-color="#f0dde3" />
    </linearGradient>
    <linearGradient id="silkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b85d68" />
      <stop offset="100%" stop-color="#8a3c45" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgDress)" rx="12" />
  <g transform="translate(60, 45)">
    <!-- Spaghetti Straps -->
    <line x1="105" y1="35" x2="115" y2="75" stroke="#752e37" stroke-width="3" />
    <line x1="175" y1="35" x2="165" y2="75" stroke="#752e37" stroke-width="3" />
    <!-- Dress Bodice & Skirt -->
    <path d="M105,75 Q140,90 175,75 L185,120 Q165,150 195,270 L85,270 Q115,150 95,120 Z" fill="url(#silkGrad)" />
    <!-- Floral motifs -->
    <circle cx="130" cy="120" r="5" fill="#f7d4dc" opacity="0.8" />
    <circle cx="155" cy="150" r="6" fill="#f7d4dc" opacity="0.8" />
    <circle cx="125" cy="180" r="5" fill="#f7d4dc" opacity="0.8" />
    <circle cx="160" cy="210" r="7" fill="#f7d4dc" opacity="0.8" />
    <circle cx="110" cy="230" r="6" fill="#f7d4dc" opacity="0.8" />
    <circle cx="145" cy="250" r="5" fill="#f7d4dc" opacity="0.8" />
    <!-- Hem slit -->
    <line x1="165" y1="230" x2="175" y2="270" stroke="#682129" stroke-width="2" />
  </g>
  <text x="200" y="365" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#8c5861" text-anchor="middle" letter-spacing="1.5">THRIFTEDGH • SILK SLIP DRESS</text>
</svg>