<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7f2" />
      <stop offset="100%" stop-color="#e3e8de" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgCord)" rx="12" />
  <g transform="translate(65, 45)">
    <!-- Waistband -->
    <path d="M70,45 L200,45 L195,65 L75,65 Z" fill="#4d533c" />
    <!-- Belt loops -->
    <rect x="90" y="45" width="6" height="20" fill="#383d2a" />
    <rect x="135" y="45" width="6" height="20" fill="#383d2a" />
    <rect x="175" y="45" width="6" height="20" fill="#383d2a" />
    <!-- Trousers Legs -->
    <path d="M75,65 L135,65 L135,160 L140,265 L85,265 L70,120 Z" fill="#585f44" />
    <path d="M135,65 L195,65 L200,120 L185,265 L130,265 L135,160 Z" fill="#52583f" />
    <!-- Pleats & Crease lines -->
    <line x1="105" y1="65" x2="110" y2="265" stroke="#3d422e" stroke-width="2" />
    <line x1="165" y1="65" x2="160" y2="265" stroke="#3d422e" stroke-width="2" />
    <!-- Pockets -->
    <line x1="75" y1="75" x2="100" y2="100" stroke="#3d422e" stroke-width="2" />
    <line x1="195" y1="75" x2="170" y2="100" stroke="#3d422e" stroke-width="2" />
  </g>
  <text x="200" y="365" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#5a634a" text-anchor="middle" letter-spacing="1.5">THRIFTEDGH • OLIVE CORDUROY</text>
</svg>