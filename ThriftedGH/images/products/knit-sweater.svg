    <polygon points="100,165 155,140 210,165 155,190" fill="#c49a64" />
    <polygon points="90,205 155,180 220,205 155,230" fill="#5c4428" />
    <!-- Ribbed Cuffs and Hem -->
    <rect x="90" y="255" width="130" height="15" fill="#755a36" />
    <line x1="30" y1="225" x2="65" y2="235" stroke="#755a36" stroke-width="8" />
    <line x1="280" y1="225" x2="245" y2="235" stroke="#755a36" stroke-width="8" />
  </g>
  <text x="200" y="365" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#7d613e" text-anchor="middle" letter-spacing="1.5">THRIFTEDGH • PATTERN SWEATER</text>
</svg>