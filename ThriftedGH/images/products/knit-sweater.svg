    <path d="M110,50 Q155,75 200,50 Q155,90 110,50 Z" fill="#8c6d46" />
    <!-- Body & Sleeves -->
    <path d="M70,85 L110,50 L200,50 L240,85 L220,265 L90,265 Z" fill="#a4835a" />
    <path d="M70,85 L30,225 L65,235 L90,140" fill="#91724b" />
