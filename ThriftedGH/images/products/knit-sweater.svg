      <stop offset="0%" stop-color="#faf6f0" />
      <stop offset="100%" stop-color="#ebe2d3" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgKnit)" rx="12" />
  <g transform="translate(45, 45)">
